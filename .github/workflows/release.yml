name: goreleaser

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Install Mono
        run: sudo apt-get update && sudo apt-get install -y mono-devel
      - name: Install Chocolatey
        run: |
          # Chocolatey 1.x supports Mono on Linux.
          mkdir -p "$RUNNER_TEMP/chocolatey" "$RUNNER_TEMP/bin"
          curl --fail --location --silent --show-error \
            "https://github.com/chocolatey/choco/releases/download/1.3.0/chocolatey.v1.3.0.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/chocolatey"
          cat > "$RUNNER_TEMP/bin/choco" <<'EOF'
          #!/usr/bin/env bash
          exec mono "${RUNNER_TEMP}/chocolatey/choco.exe" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/choco"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
