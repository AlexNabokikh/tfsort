name: CI
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  release-config:
    name: GoReleaser configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          verify: true

  tests:
    name: Tests
    needs: golangci-lint
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # - windows-latest - temporarily disabled due to github actions bug
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Install dependencies
        run: go mod download
      - name: Go Test
        run: make test

  coverage:
    name: Coverage
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Run tests with coverage
        run: make coverage
      - name: Qlty Coverage Action
        uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{secrets.QLTY_COVERAGE_TOKEN}}
          files: c.out
